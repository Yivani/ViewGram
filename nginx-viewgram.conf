# Nginx configuration for ViewGram
# Place this file at: /etc/nginx/sites-available/viewgram
# Then create symlink: sudo ln -s /etc/nginx/sites-available/viewgram /etc/nginx/sites-enabled/

# HTTP to HTTPS redirect (enabled after SSL setup)
server {
    listen 80;
    server_name viewgram.yivani.dev www.viewgram.yivani.dev;

    # Uncomment after SSL setup:
    # return 301 https://$server_name$request_uri;

    # For initial setup (before SSL), use this:
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

